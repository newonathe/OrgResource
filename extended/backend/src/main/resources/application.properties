server.address=127.0.0.1
server.port=${EXT_SERVER_PORT:8085}

spring.datasource.url=${EXT_DB_URL}
spring.datasource.username=${EXT_DB_USER}
spring.datasource.password=${EXT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

spring.flyway.enabled=true
spring.flyway.url=${EXT_DB_MIGRATION_URL:${EXT_DB_URL}}
spring.flyway.user=${EXT_DB_MIGRATION_USER:${EXT_DB_USER}}
spring.flyway.password=${EXT_DB_MIGRATION_PASSWORD:${EXT_DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jersey.application-path=/api
spring.main.banner-mode=off
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.name=__Host-ORGSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

c1.sms.enabled=${EXT_SMS_ENABLED:false}
c1.contact.encryption-key=${EXT_CONTACT_ENCRYPTION_KEY:}
c1.contact.encryption-key-id=${EXT_CONTACT_ENCRYPTION_KEY_ID:local-v1}
c1.scheduler.fixed-delay-ms=${EXT_SCHEDULER_DELAY_MS:60000}
c1.scheduler.batch-size=${EXT_SCHEDULER_BATCH_SIZE:100}
c1.reminder.mode=${EXT_REMINDER_MODE:DISABLED}
c1.reminder.base-url=${EXT_REMINDER_BASE_URL:http://127.0.0.1:9099/}
c1.reminder.twilio-account-sid=${EXT_TWILIO_ACCOUNT_SID:}
c1.reminder.twilio-auth-token=${EXT_TWILIO_AUTH_TOKEN:}
c1.reminder.twilio-from=${EXT_TWILIO_FROM:+15555550123}
c1.session.absolute-lifetime=12h
c1.throttle.capacity=5
c1.throttle.window=15m
c1.bootstrap.recovery-code-lifetime=365d

spring.profiles.group.c1-test=
