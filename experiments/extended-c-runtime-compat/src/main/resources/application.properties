server.address=127.0.0.1
server.port=${C0_SERVER_PORT:8085}

spring.datasource.url=${ORG_C0_DB_URL}
spring.datasource.username=${ORG_C0_DB_USER}
spring.datasource.password=${ORG_C0_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=6

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
spring.jersey.application-path=/api
spring.main.banner-mode=off

c0.sms.enabled=${ORG_C0_SMS_ENABLED:false}
c0.scheduler.fixed-delay-ms=${ORG_C0_SCHEDULER_DELAY_MS:60000}

spring.profiles.group.c0-test=
