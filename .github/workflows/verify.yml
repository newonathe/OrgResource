name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Java 8 and isolated MySQL tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: orgresource_test
          MYSQL_USER: orgresource_test
          MYSQL_PASSWORD: orgresource_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      # This CI-only test database uses MySQL 8 caching_sha2_password on loopback.
      ORG_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/orgresource_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ORG_TEST_DB_USER: orgresource_test
      ORG_TEST_DB_PASSWORD: orgresource_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend against isolated MySQL
        run: bash mvnw -B clean verify

  frontend:
    name: React typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
