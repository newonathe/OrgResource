name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Java 8 and isolated MySQL tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: orgresource_test
          MYSQL_USER: orgresource_test
          MYSQL_PASSWORD: orgresource_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      # This CI-only test database uses MySQL 8 caching_sha2_password on loopback.
      ORG_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/orgresource_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ORG_TEST_DB_USER: orgresource_test
      ORG_TEST_DB_PASSWORD: orgresource_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React application
        run: |
          npm --prefix ../frontend ci
          npm --prefix ../frontend run typecheck
          npm --prefix ../frontend test
          npm --prefix ../frontend run lint
          npm --prefix ../frontend run build
      - name: Verify backend and bundle React application against isolated MySQL
        run: bash mvnw -B -Pbundle-react-ui clean verify
      - name: Install Chromium for frozen Course A acceptance
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the frozen Course A packaged JAR and original collection
        run: |
          set -euo pipefail
          java -jar target/orgresource-0.1.0-SNAPSHOT.jar --spring.profiles.active=test > /tmp/orgresource-jar.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/ > /tmp/orgresource-index.html; then break; fi
            sleep 2
          done
          grep -Eq 'assets/index-[^" ]+\.js' /tmp/orgresource-index.html
          asset_path=$(grep -oE 'assets/index-[^" ]+\.js' /tmp/orgresource-index.html | head -n 1)
          curl --silent --fail "http://127.0.0.1:8080/$asset_path" > /dev/null
          for route in departments projects resources requirements allocations; do
            curl --silent --fail "http://127.0.0.1:8080/api/$route" > /dev/null
          done
          cd ..
          node scripts/prepare-course-a-newman.mjs postman/OrgResource-Course-A-28-Routes.postman_collection.json "$RUNNER_TEMP/course-a-newman.json"
          npx --yes newman@6.2.3 run "$RUNNER_TEMP/course-a-newman.json" \
            --environment postman/OrgResource-Course-A-Local.postman_environment.json --reporters cli --bail
          npm --prefix frontend run e2e -- --grep 'the packaged Java application serves'
      - uses: actions/upload-artifact@v4
        with:
          name: orgresource-executable-java8
          path: backend/target/orgresource-0.1.0-SNAPSHOT.jar
          if-no-files-found: error

  frontend:
    name: React typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  extended-c3:
    name: Extended C Java 21, isolated MySQL, Newman and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: orgresource_c1_ci
          MYSQL_USER: orgresource_c1_ci
          MYSQL_PASSWORD: c1_ci_only
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      EXT_DB_URL: jdbc:mysql://127.0.0.1:3306/orgresource_c1_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EXT_DB_USER: orgresource_c1_ci
      EXT_DB_PASSWORD: c1_ci_only
      EXT_DB_MIGRATION_URL: jdbc:mysql://127.0.0.1:3306/orgresource_c1_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EXT_DB_MIGRATION_USER: root
      EXT_DB_MIGRATION_PASSWORD: root_ci_only
      EXT_BOOTSTRAP_SLUG: c1-seed-workspace
      EXT_BOOTSTRAP_ORG_NAME: Fictional C1 Workspace
      EXT_BOOTSTRAP_USERNAME: c1-owner
      EXT_BOOTSTRAP_DISPLAY_NAME: C1 Owner
      EXT_BOOTSTRAP_PASSWORD: c1-ci-bootstrap-only-7f43d8d1
      EXT_SMS_ENABLED: 'false'
      EXT_REMINDER_MODE: DISABLED
      EXT_SCHEDULER_DELAY_MS: '60000'
      EXT_SERVER_PORT: '8080'
      SPRING_PROFILES_ACTIVE: c1-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            extended/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extended/frontend/package-lock.json
      - name: Generate ephemeral contact-encryption test key
        shell: bash
        run: |
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          printf 'EXT_CONTACT_ENCRYPTION_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Build React assets for packaged Extended runtime
        run: |
          npm --prefix extended/frontend ci
          npm --prefix extended/frontend run typecheck
          npm --prefix extended/frontend test
          npm --prefix extended/frontend run lint
          npm --prefix extended/frontend run build
      - name: Install Chromium for packaged browser acceptance
        working-directory: extended/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify Extended C Java 21 backend against isolated MySQL
        run: bash ./backend/mvnw -B -f extended/backend/pom.xml clean verify
      - name: Run authenticated Newman and browser acceptance against packaged JAR
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          ORGRESOURCE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/orgresource-c4-screenshots
        shell: bash
        run: |
          set -euo pipefail
          java -Duser.timezone=Asia/Manila -jar extended/backend/target/extended-backend-0.1.0-SNAPSHOT.jar > /tmp/orgresource-extended-c3.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/ > /tmp/orgresource-extended-c3-index.html; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/orgresource-extended-c3.log; exit 1; fi
          grep -Eq 'assets/index-[^" ]+\.js' /tmp/orgresource-extended-c3-index.html
          npx --yes newman@6.2.3 run postman/OrgResource-Extended-C3-28-Operations.postman_collection.json \
            --reporters cli --bail --delay-request 1000 \
            --env-var baseUrl=http://127.0.0.1:8080 \
            --env-var username="$EXT_BOOTSTRAP_USERNAME" \
            --env-var password="$EXT_BOOTSTRAP_PASSWORD" \
            --env-var imagePath="$GITHUB_WORKSPACE/postman/fixtures/academic-demo-image.png"
          npx --yes newman@6.2.3 run postman/OrgResource-Extended-C6a-Reporting.postman_collection.json \
            --reporters cli --bail \
            --env-var baseUrl=http://127.0.0.1:8080 \
            --env-var username="$EXT_BOOTSTRAP_USERNAME" \
            --env-var password="$EXT_BOOTSTRAP_PASSWORD"
          docker exec -i --env MYSQL_PWD=root_ci_only "$MYSQL_CONTAINER" mysql -uroot orgresource_c1_ci <<'SQL'
          INSERT INTO organization(public_id,slug,display_name,status,created_at,updated_at)
          VALUES(UUID_TO_BIN(UUID(),0),'c4-e2e-secondary','C4 Tenant Isolation','ACTIVE',UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
          SET @c4_e2e_org_id=LAST_INSERT_ID();
          INSERT INTO membership(public_id,org_id,user_id,role,status,created_at,updated_at)
          SELECT UUID_TO_BIN(UUID(),0),@c4_e2e_org_id,id,'OWNER','ACTIVE',UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)
          FROM user_account WHERE username_key='c1-owner';
          SQL
          EXT_E2E_BASE_URL=http://127.0.0.1:8080 \
            EXT_E2E_USERNAME="$EXT_BOOTSTRAP_USERNAME" \
            EXT_E2E_PASSWORD="$EXT_BOOTSTRAP_PASSWORD" \
            npm --prefix extended/frontend run e2e
