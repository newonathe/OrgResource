name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Java 8 and isolated MySQL tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: orgresource_test
          MYSQL_USER: orgresource_test
          MYSQL_PASSWORD: orgresource_test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      # This CI-only test database uses MySQL 8 caching_sha2_password on loopback.
      ORG_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/orgresource_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ORG_TEST_DB_USER: orgresource_test
      ORG_TEST_DB_PASSWORD: orgresource_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # An Adoptium release redirect intermittently returned non-gzip HTML in CI.
      # Keep Java 8 mandatory: only fall back to a second verified JDK vendor.
      - name: Set up Temurin Java 8
        id: setup_java8_temurin
        uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Fallback to Zulu Java 8 when Temurin download fails
        if: steps.setup_java8_temurin.outcome == 'failure'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Require a real Java 8 compiler
        run: |
          set -euo pipefail
          javac -version
          javac -version 2>&1 | grep -Eq '^javac 1[.]8[.]'
          java -version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React application
        run: |
          npm --prefix ../frontend ci
          npm --prefix ../frontend run typecheck
          npm --prefix ../frontend test
          npm --prefix ../frontend run lint
          npm --prefix ../frontend run build
      - name: Verify backend and bundle React application against isolated MySQL
        run: bash mvnw -B -Pbundle-react-ui clean verify
      - name: Verify exact Course A source candidate and clean extracted build (no archive upload)
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 7f8c0746da18fd54b47f430ac1435ac36e605d67
          python3 docs/handoffs/claude-local-execution-2026-11-24/verify_course_a_source_export.py --build
      - name: Install Chromium for frozen Course A acceptance
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the frozen Course A packaged JAR and established acceptance collections
        run: |
          set -euo pipefail
          java -jar target/orgresource-0.1.0-SNAPSHOT.jar --spring.profiles.active=test > /tmp/orgresource-jar.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/ > /tmp/orgresource-index.html; then break; fi
            sleep 2
          done
          grep -Eq 'assets/index-[^" ]+\.js' /tmp/orgresource-index.html
          asset_path=$(grep -oE 'assets/index-[^" ]+\.js' /tmp/orgresource-index.html | head -n 1)
          curl --silent --fail "http://127.0.0.1:8080/$asset_path" > /dev/null
          for route in departments projects resources requirements allocations; do
            curl --silent --fail "http://127.0.0.1:8080/api/$route" > /dev/null
          done
          cd ..
          pwsh -NoProfile -File scripts/run-api-acceptance.ps1
          python3 docs/handoffs/claude-local-execution-2026-11-24/verify_course_a_standalone_candidate.py --jar backend/target/orgresource-0.1.0-SNAPSHOT.jar
          npm --prefix frontend run e2e -- --grep 'the packaged Java application serves'
      - uses: actions/upload-artifact@v4
        with:
          name: orgresource-executable-java8
          path: backend/target/orgresource-0.1.0-SNAPSHOT.jar
          if-no-files-found: error

  frontend:
    name: React typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  extended-c3:
    name: Extended C Java 21, isolated MySQL, Newman and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: orgresource_c1_ci
          MYSQL_USER: orgresource_c1_ci
          MYSQL_PASSWORD: c1_ci_only
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      EXT_DB_URL: jdbc:mysql://127.0.0.1:3306/orgresource_c1_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EXT_DB_USER: orgresource_c1_ci
      EXT_DB_PASSWORD: c1_ci_only
      EXT_DB_MIGRATION_URL: jdbc:mysql://127.0.0.1:3306/orgresource_c1_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      EXT_DB_MIGRATION_USER: root
      EXT_DB_MIGRATION_PASSWORD: root_ci_only
      EXT_BOOTSTRAP_SLUG: c1-seed-workspace
      EXT_BOOTSTRAP_ORG_NAME: Fictional C1 Workspace
      EXT_BOOTSTRAP_USERNAME: c1-owner
      EXT_BOOTSTRAP_DISPLAY_NAME: C1 Owner
      EXT_BOOTSTRAP_PASSWORD: c1-ci-bootstrap-only-7f43d8d1
      EXT_SMS_ENABLED: 'false'
      EXT_REMINDER_MODE: DISABLED
      EXT_SCHEDULER_DELAY_MS: '60000'
      EXT_SERVER_PORT: '8080'
      SPRING_PROFILES_ACTIVE: c1-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            extended/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extended/frontend/package-lock.json
      - name: Check tracked 93-route C8 source inventory and final 29 policy mappings
        run: |
          node scripts/verify-c8-routes.mjs
          node scripts/verify-c8-oracle-coverage.mjs
      - name: Generate ephemeral contact-encryption test key
        shell: bash
        run: |
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          printf 'EXT_CONTACT_ENCRYPTION_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Build React assets for packaged Extended runtime
        run: |
          npm --prefix extended/frontend ci
          npm --prefix extended/frontend run typecheck
          npm --prefix extended/frontend test
          npm --prefix extended/frontend run lint
          npm --prefix extended/frontend run build
      - name: Install Chromium for packaged browser acceptance
        working-directory: extended/frontend
        run: npx playwright install --with-deps chromium
      - name: Verify Extended C Java 21 backend against isolated MySQL
        run: bash ./backend/mvnw -B -f extended/backend/pom.xml clean verify
      - name: Replay and reconcile the fictional C8 small profile
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        shell: bash
        run: |
          set -euo pipefail
          schema=orgresource_c8_demo_ci_fixture
          runtime_password="$(openssl rand -hex 24)"
          migration_password="$(openssl rand -hex 24)"
          owner_password="$(openssl rand -hex 24)"
          for password in "$runtime_password" "$migration_password" "$owner_password"; do echo "::add-mask::$password"; done
          mysql_ci() { docker exec -i --env MYSQL_PWD="$EXT_DB_MIGRATION_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot "$@"; }
          mysql_ci <<SQL
          CREATE DATABASE $schema CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          CREATE USER 'c8_ci_runtime'@'%' IDENTIFIED BY '$runtime_password';
          CREATE USER 'c8_ci_migrator'@'%' IDENTIFIED BY '$migration_password';
          GRANT SELECT,INSERT,UPDATE,DELETE ON $schema.* TO 'c8_ci_runtime'@'%';
          GRANT ALL PRIVILEGES ON $schema.* TO 'c8_ci_migrator'@'%';
          SQL
          plan="$RUNNER_TEMP/c8-fictional-plan.json"
          python3 scripts/generate-c8-demo.py --profile small --seed c8-fixture-proof-v1 --output "$plan"
          digest="$(sha256sum "$plan" | cut -d' ' -f1)"
          python3 scripts/preflight-c8-demo-plan.py --plan "$plan" --sha256 "$digest" --profile small
          if python3 scripts/preflight-c8-demo-plan.py --plan "$plan" --sha256 "$(printf '%064d' 0)" --profile small; then
            echo "Incorrect fixture hash unexpectedly passed C8 preflight" >&2
            exit 1
          fi
          EXT_C8_DEMO_TARGET="$schema" EXT_C8_DEMO_CONFIRM_TARGET="IMPORT $schema" EXT_C8_DEMO_PORT=3306 \
            EXT_C8_DEMO_PLAN="$plan" EXT_C8_DEMO_PLAN_SHA256="$digest" EXT_C8_DEMO_OWNER_PASSWORD="$owner_password" \
            EXT_DB_USER=c8_ci_runtime EXT_DB_PASSWORD="$runtime_password" \
            EXT_DB_MIGRATION_USER=c8_ci_migrator EXT_DB_MIGRATION_PASSWORD="$migration_password" \
            java -jar extended/backend/target/extended-backend-0.1.0-SNAPSHOT.jar --c8-local-demo-import
          counts="$(mysql_ci --batch --skip-column-names "$schema" -e 'SELECT (SELECT COUNT(*) FROM organization),(SELECT COUNT(*) FROM allocation),(SELECT COUNT(*) FROM stock_movement),(SELECT COUNT(*) FROM local_credential);')"
          [ "$counts" = $'3\t36\t40\t1' ]
      - name: Prove isolated additive replay preserves existing owner and refuses repeat
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        shell: bash
        run: |
          bash -n scripts/verify-c8-additive-isolated.sh
          bash scripts/verify-c8-additive-isolated.sh small
          bash scripts/verify-c8-additive-isolated.sh intermediate
          bash scripts/verify-c8-additive-isolated.sh small-partial
      - name: Prove local mixed rehearsal preparation with public fictional originals
        shell: bash
        run: bash scripts/test-c9-local-mixed-preparation.sh
      - name: Run authenticated Newman and browser acceptance against packaged JAR
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          ORGRESOURCE_E2E_SCREENSHOT_DIR: ${{ runner.temp }}/orgresource-c4-screenshots
        shell: bash
        run: |
          set -euo pipefail
          java -Duser.timezone=Asia/Manila -jar extended/backend/target/extended-backend-0.1.0-SNAPSHOT.jar > /tmp/orgresource-extended-c3.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/ > /tmp/orgresource-extended-c3-index.html; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/orgresource-extended-c3.log; exit 1; fi
          grep -Eq 'assets/index-[^" ]+\.js' /tmp/orgresource-extended-c3-index.html
          npx --yes newman@6.2.3 run postman/OrgResource-Extended-C3-28-Operations.postman_collection.json \
            --reporters cli --bail --delay-request 1000 \
            --env-var baseUrl=http://127.0.0.1:8080 \
            --env-var username="$EXT_BOOTSTRAP_USERNAME" \
            --env-var password="$EXT_BOOTSTRAP_PASSWORD" \
            --env-var imagePath="$GITHUB_WORKSPACE/postman/fixtures/academic-demo-image.png"
          npx --yes newman@6.2.3 run postman/OrgResource-Extended-C6a-Reporting.postman_collection.json \
            --reporters cli --bail \
            --env-var baseUrl=http://127.0.0.1:8080 \
            --env-var username="$EXT_BOOTSTRAP_USERNAME" \
            --env-var password="$EXT_BOOTSTRAP_PASSWORD"
          docker exec -i --env MYSQL_PWD=root_ci_only "$MYSQL_CONTAINER" mysql -uroot orgresource_c1_ci <<'SQL'
          INSERT INTO organization(public_id,slug,display_name,status,created_at,updated_at)
          VALUES(UUID_TO_BIN(UUID(),0),'c4-e2e-secondary','C4 Tenant Isolation','ACTIVE',UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
          SET @c4_e2e_org_id=LAST_INSERT_ID();
          INSERT INTO membership(public_id,org_id,user_id,role,status,created_at,updated_at)
          SELECT UUID_TO_BIN(UUID(),0),@c4_e2e_org_id,id,'OWNER','ACTIVE',UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)
          FROM user_account WHERE username_key='c1-owner';
          SQL
          EXT_E2E_BASE_URL=http://127.0.0.1:8080 \
            EXT_E2E_USERNAME="$EXT_BOOTSTRAP_USERNAME" \
            EXT_E2E_PASSWORD="$EXT_BOOTSTRAP_PASSWORD" \
            npm --prefix extended/frontend run e2e
          # R038: actual complete connectivity loss in this job's disposable CI service.
          # Never execute on a self-hosted runner or against a local/operator database.
          if [ "$GITHUB_ACTIONS" != true ] || [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo "R038 outage fixture refused: not a GitHub-hosted job" >&2
            exit 1
          fi
          APP_PID="$app_pid" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import socket
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import uuid

          def require(ok, phase):
              if not ok:
                  raise RuntimeError("R038_OUTAGE_REFUSED:" + phase)

          def docker(*args, timeout=25, env=None):
              # Do not emit raw SQL dumps, service environment, command errors or credentials.
              result = subprocess.run(["docker", *args], stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, timeout=timeout, env=env)
              require(result.returncode == 0, "docker_" + args[0])
              return result.stdout

          cid = os.environ.get("MYSQL_CONTAINER", "")
          require(re.fullmatch(r"[0-9a-f]{64}", cid) is not None, "service_id")
          require(os.environ.get("GITHUB_ACTIONS") == "true"
                  and os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted", "runner")
          schema = "orgresource_c1_ci"
          endpoint = "jdbc:mysql://127.0.0.1:3306/" + schema
          require(all(os.environ.get(k, "").split("?", 1)[0] == endpoint
                      for k in ("EXT_DB_URL", "EXT_DB_MIGRATION_URL")), "db_urls")
          require(os.environ.get("EXT_DB_USER") == schema
                  and os.environ.get("EXT_DB_MIGRATION_USER") == "root", "fixture_principals")
          info = json.loads(docker("inspect", cid))[0]
          require(info["Id"] == cid and info["Config"]["Image"] == "mysql:8.0.46"
                  and info["State"]["Running"]
                  and "MYSQL_DATABASE=" + schema in info["Config"]["Env"]
                  and any(p.get("HostPort") == "3306"
                          for p in info["NetworkSettings"]["Ports"].get("3306/tcp", []) or []),
                  "exact_job_service")
          sql_env = dict(os.environ, MYSQL_PWD=os.environ["EXT_DB_MIGRATION_PASSWORD"])

          def mysql(query):
              return docker("exec", "--env", "MYSQL_PWD", cid, "mysql", "-uroot",
                            "--connect-timeout=3", "--batch", "--skip-column-names",
                            schema, "-e", query, timeout=8, env=sql_env).decode().strip()

          def snapshot():
              # Exact rows in the four tables read by the metadata classifier.
              # Sessions and unrelated scheduled state are intentionally outside this oracle.
              raw = docker("exec", "--env", "MYSQL_PWD", cid, "mysqldump", "-uroot",
                           "--no-create-info", "--skip-comments", "--skip-triggers",
                           "--skip-lock-tables", "--single-transaction", "--order-by-primary",
                           "--skip-extended-insert", "--no-tablespaces",
                           "--set-gtid-purged=OFF", schema, "organization", "membership",
                           "user_account", "local_credential", env=sql_env)
              require(bool(raw), "empty_snapshot")
              return hashlib.sha256(raw).hexdigest()

          app_pid = int(os.environ["APP_PID"])
          require(app_pid > 1, "app_pid")
          def start_id():
              with open("/proc/" + str(app_pid) + "/stat", encoding="ascii") as f:
                  return f.read().rsplit(")", 1)[1].split()[19]

          app_start = start_id()
          # No proxy, retries, auth cookies or cached HTTP result.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def request(path, timeout=25):
              try:
                  response = opener.open("http://127.0.0.1:8080" + path, timeout=timeout)
              except urllib.error.HTTPError as failure:
                  response = failure
              with response:
                  return response.status, response.headers, response.read(65537)

          def metadata():
              status, headers, body = request("/api/v2/demo/metadata")
              require(len(body) <= 65536 and
                      headers.get("Content-Type", "").startswith("application/json"), "json_response")
              require("no-store" in headers.get("Cache-Control", ""), "no_store")
              payload = json.loads(body)
              request_id = payload.get("requestId")
              require(isinstance(request_id, str) and str(uuid.UUID(request_id)) == request_id
                      and headers.get("X-Request-ID") == request_id, "request_identity")
              return status, payload, body

          server_before = mysql("SELECT CONCAT(@@server_uuid,':',DATABASE())")
          require(server_before.endswith(":" + schema), "server_identity")
          uuid.UUID(server_before.split(":", 1)[0])
          before_rows = snapshot()
          before_status, before, _ = metadata()
          require(before_status == 200 and before["data"]["synthetic"] is False, "ordinary_baseline")
          require(request("/")[0] == 200, "app_baseline")
          print("G01_R038_DISCONNECT_PHASE:baseline_ok", flush=True)
          attempted = False
          try:
              # This ID is the service container created by the CURRENT hosted job.
              attempted = True
              docker("stop", "--time", "10", cid)
              require(json.loads(docker("inspect", cid))[0]["State"]["Running"] is False,
                      "service_not_stopped")
              try:
                  conn = socket.create_connection(("127.0.0.1", 3306), timeout=2)
              except OSError:
                  pass
              else:
                  conn.close()
                  raise RuntimeError("R038_OUTAGE_REFUSED:port_still_listening")
              require(start_id() == app_start and request("/")[0] == 200, "app_not_alive")
              status, failure, body = metadata()
              require(status == 500 and set(failure) == {"code", "message", "requestId"}
                      and failure["code"] == "INTERNAL_ERROR"
                      and failure["message"] == "The request could not be completed.",
                      "generic_http500")
              require(schema.encode() not in body and b"jdbc:" not in body, "leak")
              require(start_id() == app_start, "app_restarted_during_outage")
              print("G01_R038_DISCONNECT_PHASE:actual_service_stopped_http500", flush=True)
          finally:
              if attempted:
                  # Restore the same service even if an assertion fails; never create a replacement.
                  docker("start", cid)
                  ready = False
                  for _ in range(30):
                      try:
                          if mysql("SELECT CONCAT(@@server_uuid,':',DATABASE())") == server_before:
                              ready = True
                              break
                      except (RuntimeError, subprocess.TimeoutExpired):
                          pass
                      time.sleep(1)
                  require(ready, "same_service_restore")
          # The same running JVM must recover without application restart.
          status, recovered, _ = metadata()
          require(status == 200 and recovered["data"] == before["data"]
                  and start_id() == app_start, "same_app_recovery")
          require(snapshot() == before_rows, "classifier_rows_changed")
          print("G01_R038_DISCONNECT_OK:actual_service_stopped=true http500=true noStore=true sameServer=true sameJvm=true exactClassifierRows=true recovered200=true", flush=True)
          PY
