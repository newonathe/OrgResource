spring.datasource.url=${ORG_TEST_DB_URL}
spring.datasource.username=${ORG_TEST_DB_USER}
spring.datasource.password=${ORG_TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
orgresource.expiry.fixed-delay-ms=3600000
orgresource.expiry.batch-size=100
orgresource.expiry.scheduler-enabled=false
orgresource.reminders.mode=DISABLED
orgresource.reminders.scheduler-enabled=false
