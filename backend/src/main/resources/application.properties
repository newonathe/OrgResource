server.address=127.0.0.1
server.port=8080

spring.datasource.url=${ORG_DB_URL}
spring.datasource.username=${ORG_DB_USER}
spring.datasource.password=${ORG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# O1 uses Hibernate schema generation for this local skeleton. Replace with reviewed migrations before release.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Spring Boot 2.1's Jersey and MVC auto-configurations both register this filter name.
# MVC serves the bundled React static files; allow its standard request-context filter to replace Jersey's duplicate.
spring.main.allow-bean-definition-overriding=true

logging.level.org.hibernate.SQL=INFO

# Expiry cleanup scans bounded batches; local integration tests may override these properties.
orgresource.expiry.fixed-delay-ms=3600000
orgresource.expiry.batch-size=100
orgresource.reminders.mode=${ORGRESOURCE_REMINDERS_MODE:DISABLED}
orgresource.reminders.fixed-delay-ms=${ORGRESOURCE_REMINDERS_FIXED_DELAY_MS:3600000}
orgresource.reminders.batch-size=${ORGRESOURCE_REMINDERS_BATCH_SIZE:100}
orgresource.reminders.fake-twilio.base-url=${ORGRESOURCE_FAKE_TWILIO_BASE_URL:http://127.0.0.1:9997/}
orgresource.reminders.fake-twilio.message-service-sid=${ORGRESOURCE_FAKE_TWILIO_MESSAGE_SERVICE_SID:MG00000000000000000000000000000000}
orgresource.reminders.claim-stale-after-seconds=${ORGRESOURCE_REMINDER_CLAIM_STALE_AFTER_SECONDS:300}
