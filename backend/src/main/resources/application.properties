server.address=127.0.0.1
server.port=8080

spring.datasource.url=${ORG_DB_URL}
spring.datasource.username=${ORG_DB_USER}
spring.datasource.password=${ORG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# O1 uses Hibernate schema generation for this local skeleton. Replace with reviewed migrations before release.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.hibernate.SQL=INFO

# Expiry cleanup scans bounded batches; local integration tests may override these properties.
orgresource.expiry.fixed-delay-ms=3600000
orgresource.expiry.batch-size=100
